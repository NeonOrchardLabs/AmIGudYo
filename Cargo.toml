[package]
name = "amigood"
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Portable Windows security checks with visible evidence and bounded repairs"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "json"] }
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["default_fonts", "wgpu"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_SystemInformation", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"
codegen-units = 1

